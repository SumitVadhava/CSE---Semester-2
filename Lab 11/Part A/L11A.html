<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <style>
        div{
            height: 250px;
            width: 250px;
        }

        .div-1{
            background-image: linear-gradient(red, yellow);
            margin-bottom: 10px;
        }

        .div-2{
            background-image: radial-gradient(red, yellow, green);
        }
    </style>
</head>
<body>
    
    <div class="div-1"></div>
    <div class="div-2"></div>

</body>
</html>
